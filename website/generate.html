<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f4">
  <title>生成工程 | Hachimi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><i data-lucide="audio-lines"></i> HACHIMI</a>
    <nav class="page-nav" aria-label="页面">
      <a href="/generate" aria-current="page"><i data-lucide="file-plus-2"></i>生成工程</a>
      <a href="/arrange"><i data-lucide="list-music"></i>歌词编排</a>
    </nav>
  </header>
  <main class="generation-page">
    <div class="generation-heading">
      <h1>生成歌曲工程</h1>
      <button id="audio-tools-open" type="button"><i data-lucide="audio-waveform"></i>音频工具</button>
    </div>
    <div class="generation-layout">
      <form id="project-form" class="upload-form" aria-label="导入歌曲">
        <fieldset id="import-fields">
          <legend>导入歌曲</legend>
          <label class="file-picker">歌曲文件<input id="upload-song" name="song" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.wma" required></label>
          <label class="file-picker">演唱语言<select id="upload-language" name="language"><option value="zh">中文</option><option value="en">英文</option><option value="ja">日文</option><option value="yue">粤语</option></select></label>
          <label class="file-picker">参考歌词（可选）<input id="upload-lyrics" name="lyrics" type="file" accept=".lrc,.txt"></label>
          <label class="lyrics-lookup"><input id="upload-online-lyrics" name="onlineLyrics" type="checkbox" checked>本地没有歌词时，允许 LDDC 联网查找</label>
          <button id="upload-submit" class="primary" type="submit"><i data-lucide="wand-sparkles"></i>生成工程</button>
        </fieldset>
        <output id="upload-status" class="muted" role="status" aria-live="polite"></output>
        <p id="upload-error" class="error" role="alert" hidden></p>
      </form>
      <section class="project-history" aria-labelledby="project-history-title">
        <h2 id="project-history-title" tabindex="-1">生成记录</h2>
        <p id="history-status" class="muted" role="status">正在载入…</p>
        <p id="history-notice" class="muted" role="status"></p>
        <ul id="project-task-list" class="project-task-list"></ul>
      </section>
    </div>
  </main>
  <dialog id="delete-project-dialog" aria-labelledby="delete-project-title" aria-describedby="delete-project-details">
    <h2 id="delete-project-title">删除工程？</h2>
    <p class="delete-project-target"><strong id="delete-project-name"></strong><time id="delete-project-time" class="muted"></time></p>
    <p id="delete-project-details">本机的工程目录及其中的分轨、USTX 等文件将被删除，无法恢复。工程目录外的原始文件和已下载的文件会保留。</p>
    <p id="delete-project-error" class="error" role="alert" hidden></p>
    <form id="delete-project-form">
      <button id="delete-project-cancel" type="button" autofocus>取消</button>
      <button id="delete-project-confirm" class="danger" type="submit"><i data-lucide="trash-2"></i>删除工程</button>
    </form>
  </dialog>
  <dialog id="audio-tools-dialog" class="audio-tools-dialog" aria-labelledby="audio-tools-title">
    <div class="section-label"><h2 id="audio-tools-title">本地音频工具</h2><button id="audio-tools-close" class="icon" type="button" title="关闭" aria-label="关闭音频工具"><i data-lucide="x"></i></button></div>
    <div class="tool-tabs" role="tablist" aria-label="音频工具">
      <button id="separate-tab" type="button" role="tab" aria-selected="true" aria-controls="separate-panel"><i data-lucide="mic-vocal"></i>提取人声</button>
      <button id="ustx-tab" type="button" role="tab" aria-selected="false" aria-controls="ustx-panel" tabindex="-1"><i data-lucide="file-music"></i>USTX 样板</button>
    </div>
    <section id="separate-panel" role="tabpanel" aria-labelledby="separate-tab">
      <form id="separate-form" class="audio-tool-form">
        <label class="file-picker">歌曲文件<input id="separate-song" name="song" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.wma" required></label>
        <div class="dialog-actions"><button id="separate-submit" class="primary" type="submit"><i data-lucide="split"></i>提取人声与伴奏</button></div>
      </form>
    </section>
    <section id="ustx-panel" role="tabpanel" aria-labelledby="ustx-tab" hidden>
      <form id="ustx-form" class="audio-tool-form">
        <label class="file-picker">USTX 工程<input id="ustx-file" name="score" type="file" accept=".ustx" required></label>
        <label class="file-picker">音效组<select id="ustx-sound-pack" name="soundPack"></select></label>
        <label class="file-picker">对应伴奏<select id="ustx-backing-source" name="backingSource" required><option value="">请选择伴奏</option><option value="file">上传伴奏文件</option></select></label>
        <label id="ustx-backing-picker" class="file-picker" hidden>伴奏文件<input id="ustx-backing-file" name="backing" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.wma"></label>
        <div class="dialog-actions"><button id="ustx-submit" class="primary" type="submit"><i data-lucide="wand-sparkles"></i>生成样板</button></div>
      </form>
    </section>
    <p id="audio-tool-status" class="muted" role="status" aria-live="polite"></p>
    <div id="audio-tool-error" class="error" role="alert" hidden></div>
    <section class="audio-task-section" aria-labelledby="audio-task-title"><h3 id="audio-task-title">最近任务</h3><ul id="audio-task-list" class="audio-task-list"></ul></section>
  </dialog>
  <script src="/vendor/lucide.js"></script>
  <script type="module" src="/project-generation.js"></script>
  <script type="module" src="/audio-tools.js"></script>
</body>
</html>
